<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mini Mainframe Collection — Settings</title>
    <style>
      :root {
        --bg: #04080a;
        --panel: #0a1014;
        --fg: #d6f5ff;
        --fg-dim: #7fa6b3;
        --fg-faint: #4a6670;
        --cyan: #00d2ff;
        --green: #38e08a;
        --border: rgba(0, 210, 255, 0.4);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: "Share Tech Mono", ui-monospace, "Consolas", monospace;
        padding: 24px;
      }
      .wrap { max-width: 420px; margin: 0 auto; }
      h1 {
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--cyan);
      }
      .panel {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 4px;
        padding: 16px;
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg-dim);
        margin-bottom: 6px;
      }
      input[type="text"], select {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--fg);
        padding: 8px;
        font: inherit;
        font-size: 13px;
        border-radius: 3px;
      }
      input:focus, select:focus { outline: none; border-color: var(--cyan); }
      button {
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        border-radius: 3px;
        padding: 9px 14px;
        margin-top: 12px;
        background: var(--cyan);
        color: var(--bg);
        border: 1px solid var(--cyan);
        font-weight: 600;
      }
      .muted { color: var(--fg-dim); font-size: 12px; line-height: 1.5; }
      .ok { color: var(--green); font-size: 12px; margin-top: 8px; }
      a { color: var(--cyan); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>▸ Mini Mainframe Collection</h1>

      <div class="panel">
        <label for="apiBase">API base</label>
        <select id="apiBase">
          <option value="prod">Production — miniaturemanager.vercel.app</option>
          <option value="local">Local dev — localhost:3000</option>
        </select>
        <p class="muted" style="margin-top: 10px">
          Use Local dev only when you’re running the app yourself.
        </p>
      </div>

      <div class="panel">
        <label for="token">Personal token</label>
        <input id="token" type="text" placeholder="paste your token" autocomplete="off" />
        <p class="muted" style="margin-top: 10px">
          Generate this in the app under
          <a id="settings-link" href="#" target="_blank">Account → Browser extension</a>.
          Keep it private.
        </p>
      </div>

      <button id="save">Save</button>
      <div id="saved" class="ok" style="display: none">Saved ✓</div>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
